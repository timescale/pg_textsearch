name: Scale benchmark tests

on:
  pull_request:
    paths:
      - 'benchmarks/scale/**'
      - '.github/workflows/scale-benchmark-tests.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/scale/**'
      - '.github/workflows/scale-benchmark-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/scale/requirements.txt
      - run: pip install -r benchmarks/scale/requirements.txt
      - name: Test harness and provisioning safety
        run: |
          python -m unittest discover -s benchmarks/scale/tests -v
          python -m unittest discover -s benchmarks/scale -p 'test_*.py' -v
          for script in benchmarks/scale/{launch,bootstrap,run,install,install_go}.sh \
            benchmarks/scale/cache_reset.sh \
            benchmarks/scale/tests/check_{writer_capacity,phrase_semantics}.sh \
            benchmarks/scale/tests/check_native_rewrites.sh \
            benchmarks/scale/tests/check_tin_drain.sh
          do
            bash -n "$script"
          done
