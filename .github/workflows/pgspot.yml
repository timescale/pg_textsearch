name: pgspot Security Check

# NOTE: PR checks are consolidated in ci.yml. This workflow runs on main only.
on:
  push:
    branches: [ main ]
    paths:
      - 'sql/**'
      - '.github/workflows/pgspot.yml'

jobs:
  pgspot:
    name: Check Extension SQL
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install pgspot
      run: pip install pgspot

    - name: Run pgspot
      run: |
        # Check the current version's base install SQL file
        VERSION=$(awk -F"'" '/default_version/ {print $2}' pg_textsearch.control)
        echo "Checking sql/pg_textsearch--${VERSION}.sql"
        pgspot "sql/pg_textsearch--${VERSION}.sql"
        # Also check the upgrade script into the current version: it
        # ships the same definitions as the base install file, so an
        # unchecked one lets the same defect reach upgrading users.
        # Already-released upgrade scripts are deliberately excluded --
        # they are frozen and carry pre-existing warnings.
        for f in sql/pg_textsearch--*--"${VERSION}".sql; do
          [ -e "$f" ] || continue
          echo "Checking ${f}"
          pgspot "${f}"
        done
